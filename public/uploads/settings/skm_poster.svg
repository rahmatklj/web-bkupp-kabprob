<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f243e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGrad)" rx="32"/>

  <rect x="40" y="40" width="720" height="160" fill="url(#cardGrad)" rx="24" filter="url(#shadow)"/>
  <text x="400" y="95" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="1">PEMERINTAH KABUPATEN PROBOLINGGO</text>
  <text x="400" y="135" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">DINAS KOPERASI, USAMA MIKRO, PERDAGANGAN &amp; PERINDUSTRIAN</text>
  <text x="400" y="170" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">HASIL SURVEI KEPUASAN MASYARAKAT (SKM)</text>

  <rect x="80" y="240" width="640" height="340" fill="#ffffff" rx="28" filter="url(#shadow)"/>
  <text x="400" y="295" fill="#475569" font-family="Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle">INDEKS KEPUASAN MASYARAKAT (IKM)</text>

  <circle cx="400" cy="410" r="85" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="400" y="415" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="900" text-anchor="middle">88.75</text>
  <text x="400" y="450" fill="#78350f" font-family="Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">SKOR IKM</text>

  <rect x="250" y="515" width="300" height="42" fill="#059669" rx="12"/>
  <text x="400" y="542" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">MUTU PELAYANAN: A (SANGAT BAIK)</text>

  <g transform="translate(80, 610)">
    <rect x="0" y="0" width="300" height="130" fill="#1e293b" rx="20" stroke="#334155" stroke-width="2"/>
    <text x="25" y="40" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="700">Persyaratan Layanan</text>
    <text x="25" y="80" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="900">3.55</text>
    <text x="25" y="105" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Sesuai Standar SOP</text>

    <rect x="340" y="0" width="300" height="130" fill="#1e293b" rx="20" stroke="#334155" stroke-width="2"/>
    <text x="365" y="40" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="700">Sistem &amp; Prosedur</text>
    <text x="365" y="80" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="900">3.60</text>
    <text x="365" y="105" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Mudah &amp; Transparan</text>

    <rect x="0" y="150" width="300" height="130" fill="#1e293b" rx="20" stroke="#334155" stroke-width="2"/>
    <text x="25" y="190" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="700">Kecepatan Pelayanan</text>
    <text x="25" y="230" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="900">3.50</text>
    <text x="25" y="255" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Tepat Waktu</text>

    <rect x="340" y="150" width="300" height="130" fill="#1e293b" rx="20" stroke="#334155" stroke-width="2"/>
    <text x="365" y="190" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="700">Biaya / Tarif</text>
    <text x="365" y="230" fill="#34d399" font-family="Arial, sans-serif" font-size="28" font-weight="900">GRATIS</text>
    <text x="365" y="255" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Bebas Pungli (Rp 0)</text>
  </g>

  <text x="400" y="940" fill="#64748b" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Terima kasih atas kepercayaan &amp; partisipasi masyarakat Kabupaten Probolinggo</text>
</svg>
